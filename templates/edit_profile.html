<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="{{url_for('static', filename='CSS/style_sheet.css')}}">
</head>

<body>

    <div class="container mt-5">

        <div class="justify-content-center">
            <h2 class="text-center mb-4">Edit Profile</h2>

            <form action="/edit_profile" method="POST">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-control" type="text" id="usernmae" name="username"
                        value="{{user_data.username}}">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-control" type="email" id="email" name="email" value="{{user_data.email}}">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="passord">New Password(optional)</label>
                    <input class="form-control" type="password" id="password" name="password">
                </div>

                <button class="btn btn-primary" type="submit">Update Profile</button>
                <a class="btn btn-secondary" href="/dashboard"> Cancel</a>
            </form>
        </div>

    </div>

</body>

</html>
