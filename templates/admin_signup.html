<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Admin signup</title>
        <link rel="stylesheet" href="{{url_for('static', filename='CSS/style_sheet.css')}}">
    </head>

    <body>
        <div class="card-body">

            <h1 class="text-center">sign-up page for admins</h1>

            <form action="/admin_signup" method='POST'>
                
                <div class="mb-3">
                    <label class="form-label" for="full_name">Full Name</label>
                    <input class="form-control" type="text" id="full_name" name="full_name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input class="form-control" type="email" id="email" name="email">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="mobile_number">Mobile Number</label>
                    <input class="form-control" type="text" id="mobile_number" name="mobile_number">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="address_line01">Address line01</label>
                    <input class="form-control" type="text" id="address_line01" name="address_line01" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="address_line02">Address line02</label>
                    <input class="form-control" type="text" id="address_line02" name="address_line02">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="city">City</label>
                    <input class="form-control" type="text" id="city" name="city" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="country">Country</label>
                    <input class="form-control" type="text" id="country" name="country" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="admin_name">adminname</label>
                    <input class="form-control" type="text" id="admin_name" name="admin_name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" type="password" id="password" name="password" required>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="admin_code">Admin code</label>
                    <input class="form-control" type="text" id="admin_code" name="verification_code" required>
                </div>

                <div class="d-grid">
                    <button class="btn btn-primary" type="submit">Sign-up</button>
                </div>

                <div class="mt-3 text-center">
                    already have an account <a href="/admin_login">login here</a>
                </div>
            </form>
        </div>
    </body>
</html>
