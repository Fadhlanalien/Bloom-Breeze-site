<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>place order</title>
    <link rel="stylesheet" href="{{url_for('static', filename='CSS/style_sheet.css')}}">
</head>

<body>

    <div class="card-body">

        <div>
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <ul>
                {% for message in messages %}
                <li>{{message}}</li>
                {% endfor %}
            </ul>
            {% endif %}
            {% endwith %}
        </div>

        <h1 class="text-center mb-4">Place Order</h1>

        <div>
            <form action="/place_order" method="post" enctype="multipart/form-data">

                <div class="card-body">

                    <h3 class="card-title text-center">Product details</h3>

                    <div>
                        <input type="hidden" name="product_id" value="{{product_data.product_id}}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="product_name">Product Name</label>
                        <input class="form-control" type="text" id="product_name" name="product_name"
                            value="{{product_data.product_name}}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="colour">colour</label>
                        <input class="form-control" type="text" id="colour" name="colour"
                            value="{{customer_preference.colour}}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="size">Size</label>
                        <input class="form-control" type="text" id="size" name="size" value="{{customer_preference.size}}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="detail">Detail</label>
                        <input class="form-control" type="text" id="detail" name="detail"
                            value="{{product_data.detail}}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="price">price per piece</label>
                        <input class="form-control" type="number" id="price" name="price"
                            value="{{product_data02.price_per_piece}}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="quantity">Number of Items</label>
                        <input class="form-control" type="number" id="quantity" name="quantity" min="1" value="{{customer_preference.quantity}}" required>
                    </div>

                </div>

                <div class="card-body">

                    <h3 class="card-title text-center">Shipping Address</h3>
                    
                    <div class="mb-3">
                        <label class="form-label" for="full_name">Full Name</label>
                        <input class="form-control" type="text" id="full_name" name="full_name"
                            value="{{customer_data.full_name}}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="mobile_number">Mobile Number</label>
                        <input class="form-control" type="text" id="mobile_number" name="mobile_number"
                            value="{{customer_data.mobile_number}}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="address_line01">Address Line01</label>
                        <input class="form-control" type="text" id="address_line01" name="address_line01"
                            value="{{shipping_data.address_line01}}" required readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="address_line02">Address Line02</label>
                        <input class="form-control" type="text" id="address_line02" name="address_line02"
                            value="{{shipping_data.address_line02}}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="city">City</label>
                        <input class="form-control" type="text" id="city" name="city" value="{{shipping_data.city}}"
                            required readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="country">Country</label>
                        <input class="form-control" type="text" id="country" name="country"
                            value="{{shipping_data.country}}" readonly required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-control" type="email" id="email" name="email" value="{{customer_data.email}}"
                            readonly>
                    </div>

                    <div>
                        <a href="/edit_shipping_address" class="btn btn-secondary"> Edit Address</a>
                    </div>

                </div>

                <!-- <div class="card-body">
                    <h3 class="card-title text-center">Payment</h3>
                    <input type="file" name="payment_slip" required>
                </div> -->

                <div class="card-body">
                    <h3 class="card-title text-center">Summary</h3>
                    <div>
                        <label for="sub_total">Sub total</label>
                        <input type="number" id="sub_total" readonly>
                    </div>
                    <div>
                        <label for="shipping">Shipping</label>
                        <input type="number" name="shipping" id="shipping" value="100" readonly>
                    </div>
                    <div>
                        <label for="tax">Taxes</label>
                        <input type="number" name="tax" id="tax" value="50" readonly>
                    </div>
                    <div>
                        <label for="total_display">total</label>
                        <input type="number" id="total_display" readonly>
                    </div>
                    <input type="hidden" name="total" id="total">
                </div>


                <div class="d-grid">
                    <button class="btn btn-primary" type="submit">Place Order</button>
                </div>

                <div class="mt-3 text-center">
                    <a href="/view_products">cancel</a>
                </div>
            </form>
        </div>
    </div>

<script src="{{url_for('static', filename='JS/calculate_total.js')}}"></script>
</body>

</html>
